<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deck Files List</title>

    <script type="module" src="preambule.js"></script>
    <script type="module" src="decks/deck1.js"></script>
    <script type="module" src="decks/deck2.js"></script>
    <script type="module" src="decks/deck3.js"></script>

    <script type="module">
        import { deckLibrary } from './preambule.js';

        async function listDeckFiles() {
            const deckListDiv = document.getElementById('deckFiles');

            let html = '<ul>';
            for (const deck of deckLibrary.keys()) {
                html += `<li><a href="updateDeck.html?deck=${encodeURIComponent(deck)}"><b>${deck}</b></a></li>`;
            }
            html += '</ul>';
            deckListDiv.innerHTML = html;
        }
        window.onload = listDeckFiles;
    </script>
</head>

<body>
    <div>
        <a href="index.html">Home</a> - <a href="battle.html">Battle</a> - <a href="battleHistory.html">Battle
            History</a> - <a href="listDeckFiles.html">Editor</a>
    </div>
    <h2>Decks</h2>
    <div id="deckFiles">Loading...</div>
</body>

</html>
